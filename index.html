<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="The Open Source Society at the University of Jordan: projects, workshops, blogs and a community for people who love open source. Join us." />
    <title>Open Source Society – University of Jordan</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>

    <!-- Netlify form detection (hidden, static HTML for build-time scanning) -->
    <form name="joinForm" data-netlify="true" data-netlify-honeypot="botcheck" style="display:none" hidden>
      <input type="hidden" name="form-name" value="joinForm" />
      <input type="hidden" name="botcheck" />
      <input type="text" name="full_name" />
      <input type="tel" name="phone" />
      <input type="email" name="email" />
      <input type="text" name="university" />
      <input type="text" name="major" />
      <select name="year"><option value=""></option></select>
      <textarea name="skills"></textarea>
      <input type="url" name="github" />
      <input type="url" name="linkedin" />
      <textarea name="posts"></textarea>
      <input type="radio" name="role" value="Contributor" />
      <input type="radio" name="role" value="Member" />
      <input type="radio" name="team" value="Technical" />
      <input type="radio" name="team" value="Social Media" />
      <input type="radio" name="team" value="PR & HR" />
    </form>
  </body>
</html>
